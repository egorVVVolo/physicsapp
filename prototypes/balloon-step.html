<title>Sandbag Drop Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone screen, no scrolling — condition, live graph-first scene (fills the free height), question, answers, one button.
   Light-only by decision: the lesson app has a light base. */
:root {
  --paper: #F3F5F7;
  --surface: #FFFFFF;
  --world: #E9EFF5;   /* scene column behind the graph */
  --ink: #15202B;
  --muted: #56616D;
  --rule: #D9DFE6;
  --vel: #0B5FCC;     /* velocity / real motion */
  --acc: #B45309;     /* acceleration */
  --event: #00796B;   /* events, gaps, targets */
  --ghost: #6B7480;   /* learner's answer */
  --ok: #1E7A3C;
  --bad: #B42318;
  --font: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.35; font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 12px;
}
.app { max-width: 440px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.top { display: flex; align-items: center; gap: 10px; }
.close { width: 36px; height: 44px; border: 0; background: none; color: var(--muted); font: 22px var(--font); padding: 0; }
.progress { flex: 1; display: flex; gap: 4px; }
.progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--rule); transition: background .3s; }
.progress span.on { background: var(--ink); }
.given { margin: 0; font-size: 15px; color: var(--ink); }
.given b { font-weight: 700; }
.scene { position: relative; flex: 1; min-height: 250px; background: var(--surface); border: 1.5px solid var(--rule); border-radius: 16px; overflow: hidden; touch-action: none; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.replay { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid var(--rule); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.q { margin: 0; font-size: 17px; font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opts.row { grid-template-columns: repeat(var(--n, 3), 1fr); }
.opts.grid { grid-template-columns: 1fr 1fr; }
.opt { min-height: 46px; padding: 8px 10px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--surface); font: 600 16px var(--font); color: var(--ink); cursor: pointer; text-align: center; line-height: 1.2; }
.opts.list .opt { text-align: left; font-weight: 500; padding: 10px 14px; }
.opt[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.opt.right { border-color: var(--ok); box-shadow: inset 0 0 0 1.5px var(--ok); }
.opt.wrong { border-color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); }
.opt:disabled { cursor: default; }
.opt.dim { color: var(--muted); }
.signs { display: grid; gap: 6px; }
.sign-row { display: grid; grid-template-columns: 30px 1fr 1fr; gap: 8px; align-items: center; }
.sign-row > span { font-size: 18px; font-weight: 700; font-style: italic; }
.feedback { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; }
.feedback svg { flex: none; margin-top: 1px; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.feedback p { margin: 0; color: var(--ink); }
.feedback strong { margin-right: 4px; }
.feedback.ok strong { color: var(--ok); }
.feedback.bad strong { color: var(--bad); }
.primary { min-height: 52px; border: 0; border-radius: 14px; background: var(--ink); color: var(--surface); font: 700 17px var(--font); cursor: pointer; flex: none; }
.primary:disabled { background: var(--rule); color: var(--muted); cursor: default; }
.summary { display: grid; gap: 6px; }
.summary .row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; background: var(--surface); border: 1.5px solid var(--rule); border-radius: 12px; font-size: 15px; }
.chip { font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.chip.independent { color: var(--ok); }
.chip.assisted { color: var(--acc); }
.opt:focus-visible, .primary:focus-visible, .replay:focus-visible { outline: 3px solid var(--event); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<div class="app">
  <div class="top">
    <button class="close" aria-label="Close lesson" tabindex="-1">✕</button>
    <div class="progress" id="progress" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>
  <p class="given">A balloon rises at a steady <b>4.0 m s⁻¹</b>. A sandbag is cut loose <b>30 m</b> above the ground. Take g = 9.81 m s⁻², up is positive.</p>
  <div class="scene" id="sceneBox">
    <svg id="scene" viewBox="0 0 360 380" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sceneDesc"></svg>
    <button class="replay" id="replay" aria-label="Replay" hidden>
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10a6 6 0 1 0 2-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 2.5v3.8h3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="sr" id="sceneDesc">Height–time graph. A narrow column on the left shows the balloon and sandbag at their heights.</p>
  </div>
  <p class="q" id="prompt"></p>
  <div id="answers"></div>
  <div class="feedback" id="feedback" hidden></div>
  <button class="primary" id="primary" disabled>Check</button>
</div>

<script>
// ---------- physics model (in the app: src/physics/) ----------
const G = 9.81, H0 = 30, VB = 4;                      // up is positive
const y = (t, u, a = -G) => H0 + u * t + 0.5 * a * t * t;
const v = (t, u, a = -G) => u + a * t;
const tLand = u => (u + Math.sqrt(u * u + 2 * G * H0)) / G;
const tApex = u => u / G;
const tBack = u => 2 * u / G;                          // back at release height
const yBalloon = t => H0 + VB * t;
// solve s = ut + ½at² for t → real roots, largest first
function solveT(s, u, a) {
  const A = 0.5 * a, B = u, C = -s, D = B * B - 4 * A * C;
  if (D < 0) return [];
  return [(-B + Math.sqrt(D)) / (2 * A), (-B - Math.sqrt(D)) / (2 * A)].sort((p, q) => q - p);
}
const f1 = x => x.toFixed(1), f2 = x => x.toFixed(2);
const sgn = x => (x < 0 ? '−' : '+');
const T_REAL = tLand(VB);
const ROOTS = solveT(-H0, VB, -G);                     // [2.91, −2.10]
const T_MAX = 3.2;

// ---------- lesson content ----------
const STEPS = ['q1', 'why', 'eq', 'signs', 'roots', 'summary'];
const Q1 = [
  { id: 'zero', text: '0 m s⁻¹', u: 0, fb: 'It was rising with the balloon, so it leaves with the balloon’s 4.0 m s⁻¹ upwards.' },
  { id: 'up', text: '4.0 m s⁻¹ up', u: VB, correct: true, fb: 'It shares the balloon’s velocity, so it rises a little before falling.' },
  { id: 'down', text: '4.0 m s⁻¹ down', u: -VB, fb: 'Cutting the rope doesn’t flip the velocity. It starts at +4.0 m s⁻¹.' },
];
const WHY = [
  { id: 'a', text: 'It keeps the velocity it had in the balloon', correct: true, fb: 'Releasing changes the forces, not the velocity at that instant.' },
  { id: 'b', text: 'Cutting the rope gives it a push upwards', fb: 'Nothing pushes it. It already had 4.0 m s⁻¹ upwards.' },
  { id: 'c', text: 'The air carries it up for a while', fb: 'We ignore air resistance. The rise comes from the velocity it already had.' },
];
const EQ = [
  { id: 'v1', text: 'v = u + at', fb: 'This needs v, which you don’t know yet.' },
  { id: 's1', text: 's = ut + ½at²', correct: true, fb: 'You know s, u and a, and want t. No v needed.' },
  { id: 'v2', text: 'v² = u² + 2as', fb: 'There is no t in this one, and t is what you want.' },
  { id: 's2', text: 's = ½(u + v)t', fb: 'This needs v, which you don’t know yet.' },
];
const ROOT_OPTS = ROOTS.map((r, i) => ({
  id: 'r' + i, t: r, correct: r > 0,
  text: 't = ' + (r < 0 ? '−' : '') + f2(Math.abs(r)) + ' s',
  fb: r > 0 ? 'Time after release has to be positive.' : 'A negative time is before the release, when the sandbag wasn’t falling freely.',
}));
const SIGNS = { s: [H0, -H0], u: [VB, -VB], a: [G, -G] };
const RIGHT = { s: -H0, u: VB, a: -G };
const SIGN_FB = {
  s: 'The ground is 30 m below the release point, so s = −30 m.',
  u: 'It starts moving up, so u = +4.0 m s⁻¹.',
  a: 'Gravity points down, so a = −9.81 m s⁻².',
};

// ---------- state ----------
const S = {
  step: 'q1', choice: null, signs: {}, checked: false, outcomes: {},
  revealed: false, ghostU: null, target: null, endT: 0, primaryAfter: 'Next',
  t: 0, playing: false, holding: false, events: [], shown: null, ended: false, dragHintSeen: false,
};

// ---------- drawing ----------
const $ = id => document.getElementById(id);
const svg = $('scene');
const NS = 'http://www.w3.org/2000/svg';
const GROUND = 350, PXM = 5.9;                    // 0 m at y=350, 50 m at y=55
const Y = m => GROUND - m * PXM;
const L = 120, R = 348;
const X = t => L + (t / T_MAX) * (R - L);
const XC = 52;                                     // world column centre
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function el(tag, attrs, txt) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (txt != null) e.textContent = txt;
  return e;
}
function text(g, x, yy, s, o = {}) {
  g.appendChild(el('text', { x, y: yy, 'font-size': o.size || 12, 'font-weight': o.weight || 500, fill: o.fill || '#56616D', 'text-anchor': o.anchor || 'start' }, s));
}
function defs() {
  const d = el('defs', {});
  const hatch = el('pattern', { id: 'hatch', width: 7, height: 7, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' });
  hatch.appendChild(el('line', { x1: 0, y1: 0, x2: 0, y2: 7, stroke: '#15202B', 'stroke-width': 1 }));
  d.appendChild(hatch);
  const mk = (id, color, dbl) => {
    const m = el('marker', { id, viewBox: '0 0 12 12', refX: 10, refY: 6, markerWidth: 10, markerHeight: 10, orient: 'auto', markerUnits: 'userSpaceOnUse' });
    m.appendChild(el('path', { d: 'M2,1.5 L10,6 L2,10.5', fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    if (dbl) m.appendChild(el('path', { d: 'M-3,1.5 L5,6 L-3,10.5', fill: 'none', stroke: color, 'stroke-width': 2.2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    return m;
  };
  d.appendChild(mk('mv', '#0B5FCC'));
  d.appendChild(mk('ma', '#B45309', true));
  svg.appendChild(d);
}

function frame(g) {
  g.appendChild(el('rect', { x: 0, y: 0, width: 96, height: GROUND, fill: '#E9EFF5' }));
  for (let m = 5; m <= 50; m += 5) g.appendChild(el('line', { x1: L, y1: Y(m), x2: R, y2: Y(m), stroke: m % 10 ? '#F2F5F8' : '#E3E8EE', 'stroke-width': 1 }));
  for (let k = 1; k <= 6; k++) { const t = k / 2; g.appendChild(el('line', { x1: X(t), y1: Y(50), x2: X(t), y2: GROUND, stroke: k % 2 ? '#F2F5F8' : '#E3E8EE', 'stroke-width': 1 })); }
  g.appendChild(el('rect', { x: 0, y: GROUND, width: 360, height: 30, fill: 'url(#hatch)', opacity: 0.28 }));
  g.appendChild(el('line', { x1: 0, y1: GROUND, x2: 360, y2: GROUND, stroke: '#15202B', 'stroke-width': 2 }));
  g.appendChild(el('line', { x1: L, y1: GROUND, x2: L, y2: Y(50), stroke: '#15202B', 'stroke-width': 1.5 }));
  for (let m = 10; m <= 50; m += 10) {
    g.appendChild(el('line', { x1: L - 5, y1: Y(m), x2: L, y2: Y(m), stroke: '#15202B', 'stroke-width': 1.5 }));
    text(g, L - 8, Y(m) + 4, m, { anchor: 'end' });
  }
  text(g, L + 6, Y(50) + 4, 'height / m');
  [1, 2, 3].forEach(t => {
    g.appendChild(el('line', { x1: X(t), y1: GROUND, x2: X(t), y2: GROUND + 5, stroke: '#15202B', 'stroke-width': 1.5 }));
    text(g, X(t), GROUND + 19, t, { anchor: 'middle', fill: '#15202B', weight: 600 });
  });
  text(g, L - 8, GROUND + 19, 't / s', { anchor: 'end' });
}

function balloon(g, t) {
  const yb = Y(yBalloon(t));
  g.appendChild(el('path', { d: `M${XC - 6},${yb - 9} L${XC - 13},${yb - 26} M${XC + 6},${yb - 9} L${XC + 13},${yb - 26}`, stroke: '#15202B', 'stroke-width': 1.1 }));
  g.appendChild(el('path', { d: `M${XC - 7},${yb - 9} h14 l-2,8 h-10 z`, fill: '#FFFFFF', stroke: '#15202B', 'stroke-width': 1.6, 'stroke-linejoin': 'round' }));
  const top = yb - 62;
  g.appendChild(el('path', { d: `M${XC - 13},${yb - 26} C${XC - 26},${top + 30} ${XC - 22},${top} ${XC},${top} C${XC + 22},${top} ${XC + 26},${top + 30} ${XC + 13},${yb - 26} Z`, fill: '#FFFFFF', stroke: '#15202B', 'stroke-width': 1.6 }));
  g.appendChild(el('path', { d: `M${XC},${top} C${XC - 9},${top + 14} ${XC - 8},${yb - 36} ${XC - 4},${yb - 26} M${XC},${top} C${XC + 9},${top + 14} ${XC + 8},${yb - 36} ${XC + 4},${yb - 26}`, fill: 'none', stroke: '#15202B', 'stroke-width': 1 }));
  return yb;
}
function bag(g, x, yy, ghost) {
  const d = `M${x - 7},${yy + 7} q0,-11 4,-12 l-1.5,-3 h9 l-1.5,3 q4,1 4,12 z`;
  g.appendChild(ghost
    ? el('path', { d, fill: '#FFFFFF', stroke: '#6B7480', 'stroke-width': 1.6, 'stroke-dasharray': '3 2.5' })
    : el('path', { d, fill: '#15202B' }));
}
function curve(u, t0, t1) {
  let d = '';
  for (let i = 0; i <= 60; i++) {
    const t = t0 + (t1 - t0) * i / 60;
    d += (i ? 'L' : 'M') + X(t).toFixed(1) + ',' + Y(Math.max(0, y(t, u))).toFixed(1);
  }
  return d;
}
function callout(g, px, py, lines, color = '#00796B') {
  const w = Math.max(...lines.map(l => l.length)) * 6.6 + 18, h = lines.length * 16 + 10;
  let bx = px + 12, by = py - h - 12;
  if (bx + w > 354) bx = px - w - 12;
  if (bx < L + 4) bx = L + 4;
  if (by < 32) by = py + 14;
  const ay = by < py ? by + h : by;
  g.appendChild(el('line', { x1: px, y1: py, x2: Math.min(Math.max(px, bx + 10), bx + w - 10), y2: ay, stroke: color, 'stroke-width': 1.5 }));
  g.appendChild(el('rect', { x: bx, y: by, width: w, height: h, rx: 8, fill: color }));
  lines.forEach((l, i) => text(g, bx + 9, by + 19 + i * 16, l, { fill: '#FFFFFF', weight: 600, size: 12.5 }));
}
function readouts(g, t) {
  const tt = Math.min(t, T_REAL);
  const h = Math.max(0, y(tt, VB)), vv = v(tt, VB);
  text(g, 10, 24, 't', { size: 13 });
  text(g, 21, 24, f2(t) + ' s', { fill: '#15202B', size: 15, weight: 700 });
  text(g, 100, 24, 'h', { size: 13 });
  text(g, 112, 24, f1(h) + ' m', { fill: '#15202B', size: 15, weight: 700 });
  text(g, 184, 24, 'v', { size: 13 });
  text(g, 195, 24, sgn(vv) + f1(Math.abs(vv)) + ' m s⁻¹', { fill: '#0B5FCC', size: 15, weight: 700 });
}

function draw() {
  svg.replaceChildren(); defs();
  const g = el('g', {}); svg.appendChild(g);
  frame(g);
  const t = S.revealed ? S.t : 0;
  const yb = balloon(g, t);
  g.appendChild(el('line', { x1: XC + 27, y1: yb - 28, x2: XC + 27, y2: yb - 46, stroke: '#0B5FCC', 'stroke-width': 2.4, 'stroke-linecap': 'round', 'marker-end': 'url(#mv)' }));
  text(g, XC + 32, yb - 32, '4.0', { fill: '#0B5FCC', weight: 700 });

  // target height for the signs step: where "s" points
  if (S.target != null) {
    const yy = Y(Math.min(50, Math.max(0, S.target)));
    g.appendChild(el('line', { x1: 0, y1: yy, x2: R, y2: yy, stroke: '#00796B', 'stroke-width': 1.8, 'stroke-dasharray': '6 4' }));
    text(g, R - 2, yy - 7, S.target > H0 ? 's = +30 m ends up here, at 60 m' : 's = −30 m ends at the ground', { anchor: 'end', fill: '#00796B', weight: 700 });
  }

  if (!S.revealed) {
    g.appendChild(el('line', { x1: XC, y1: yb - 1, x2: XC, y2: Y(H0) - 8, stroke: '#15202B', 'stroke-width': 1.1 }));
    bag(g, XC, Y(H0), false);
    g.appendChild(el('line', { x1: XC + 10, y1: Y(H0), x2: X(0), y2: Y(H0), stroke: '#15202B', 'stroke-width': 1, 'stroke-dasharray': '2 3' }));
    g.appendChild(el('circle', { cx: X(0), cy: Y(H0), r: 4.5, fill: '#15202B' }));
    return;
  }

  readouts(g, Math.min(t, S.endT));
  g.appendChild(el('line', { x1: X(0), y1: Y(H0), x2: X(t), y2: Y(yBalloon(t)), stroke: '#15202B', 'stroke-width': 1.2, 'stroke-dasharray': '1.5 3.5', 'stroke-linecap': 'round' }));

  const tr = Math.min(t, S.endT);
  const yr = Math.max(0, y(tr, VB));
  let yg = null, tg = null;
  if (S.ghostU != null) {
    tg = Math.min(t, tLand(S.ghostU));
    yg = Math.max(0, y(tg, S.ghostU));
    g.appendChild(el('path', { d: curve(S.ghostU, 0, tg), fill: 'none', stroke: '#6B7480', 'stroke-width': 2, 'stroke-dasharray': '5 4' }));
    for (let k = 1; k * 0.25 < tg; k++) g.appendChild(el('circle', { cx: X(k * 0.25), cy: Y(y(k * 0.25, S.ghostU)), r: 2.6, fill: '#FFFFFF', stroke: '#6B7480', 'stroke-width': 1.2 }));
    bag(g, XC + 26, Y(yg), true);
    g.appendChild(el('circle', { cx: X(tg), cy: Y(yg), r: 4.5, fill: '#FFFFFF', stroke: '#6B7480', 'stroke-width': 2 }));
  }
  g.appendChild(el('path', { d: curve(VB, 0, tr), fill: 'none', stroke: '#0B5FCC', 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
  for (let k = 1; k * 0.25 < tr; k++) g.appendChild(el('circle', { cx: X(k * 0.25), cy: Y(y(k * 0.25, VB)), r: 2.8, fill: '#0B5FCC' }));
  g.appendChild(el('line', { x1: XC + 10, y1: Y(yr), x2: X(tr), y2: Y(yr), stroke: '#0B5FCC', 'stroke-width': 1, 'stroke-dasharray': '2 3', opacity: 0.7 }));
  g.appendChild(el('circle', { cx: X(tr), cy: Y(yr), r: 6, fill: '#0B5FCC', stroke: '#FFFFFF', 'stroke-width': 2 }));
  bag(g, XC, Y(yr), false);
  if (tr < T_REAL - 1e-6) {
    const len = v(tr, VB) * 2.6;
    if (Math.abs(len) > 6) g.appendChild(el('line', { x1: XC - 14, y1: Y(yr), x2: XC - 14, y2: Y(yr) - len, stroke: '#0B5FCC', 'stroke-width': 2.4, 'stroke-linecap': 'round', 'marker-end': 'url(#mv)' }));
    if (!S.shown || S.shown.kind === 'apex') g.appendChild(el('line', { x1: XC + 12, y1: Y(yr) + 4, x2: XC + 12, y2: Y(yr) + 30, stroke: '#B45309', 'stroke-width': 2.4, 'stroke-linecap': 'round', 'marker-end': 'url(#ma)' }));
  }
  const e = S.shown;
  if (e && e.kind === 'apex') {
    const ta = tApex(VB), ya = y(ta, VB);
    g.appendChild(el('line', { x1: X(ta) - 26, y1: Y(ya), x2: X(ta) + 26, y2: Y(ya), stroke: '#00796B', 'stroke-width': 2.2, 'stroke-linecap': 'round' }));
    callout(g, X(ta), Y(ya) - 4, ['Top: v = 0', 'a is still 9.81 m s⁻² down']);
  } else if (e && e.kind === 'back') {
    callout(g, X(e.t), Y(H0), ['Back at 30 m,', 'now 4.0 m s⁻¹ downwards']);
  } else if (e && e.kind === 'ghostLand') {
    const bx = X(tg) + 12;
    g.appendChild(el('path', { d: `M${bx - 5},${Y(yr)} H${bx + 5} M${bx},${Y(yr)} V${Y(yg)} M${bx - 5},${Y(yg)} H${bx + 5}`, stroke: '#00796B', 'stroke-width': 2, fill: 'none' }));
    callout(g, bx, (Y(yr) + Y(yg)) / 2, ['Yours lands at ' + f2(tg) + ' s.', 'The real one is ' + f1(yr - yg) + ' m up.']);
  } else if (e && e.kind === 'land') {
    callout(g, X(T_REAL), Y(0), ['Ground at ' + f2(T_REAL) + ' s,', f1(-v(T_REAL, VB)) + ' m s⁻¹ downwards']);
  }
  if (S.ended && !S.dragHintSeen) text(g, L + 6, Y(50) - 12, 'Drag along the graph', { fill: '#00796B', weight: 600 });
}

// ---------- playback: auto-continues through events ----------
let raf = 0, last = 0, holdTimer = 0, paused = false, dragging = false;
const HOLD = 1700;
function startPlayback(endT, events) {
  cancelAnimationFrame(raf); clearTimeout(holdTimer);
  S.revealed = true; S.endT = endT; S.events = events.slice().sort((a, b) => a.t - b.t);
  S.t = 0; S.shown = null; S.ended = false; S.playing = true; S.holding = false; paused = false;
  $('replay').hidden = true;
  setPrimary(S.primaryAfter, true);
  if (reduced) return nextReduced();
  last = performance.now(); raf = requestAnimationFrame(tick);
}
function tick(now) {
  if (!S.playing) return;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  const next = S.events.find(e => e.t > S.t + 1e-6);
  if (next && S.t + dt >= next.t) { S.t = next.t; return arrive(next); }
  S.t += dt; draw();
  raf = requestAnimationFrame(tick);
}
function arrive(e) {
  S.shown = e; draw();
  if (navigator.vibrate) try { navigator.vibrate(8); } catch (_) {}
  if (e.end) return finish();
  S.playing = false; S.holding = true;
  holdTimer = setTimeout(resume, HOLD);
}
function resume() {
  clearTimeout(holdTimer);
  S.holding = false; S.playing = true; S.shown = null;
  if (reduced) return nextReduced();
  last = performance.now(); raf = requestAnimationFrame(tick);
}
function nextReduced() {
  const next = S.events.find(e => e.t > S.t + 1e-6);
  if (!next) return finish();
  S.t = next.t; arrive(next);
}
function finish() {
  S.playing = false; S.holding = false; S.ended = true;
  $('replay').hidden = false;
  setPrimary(S.primaryAfter, false);
  draw();
}
function svgTime(ev) {
  const r = svg.getBoundingClientRect();
  const k = Math.min(r.width / 360, r.height / 380);
  const x = (ev.clientX - r.left - (r.width - 360 * k) / 2) / k;
  return Math.max(0, Math.min(S.endT, (x - L) / (R - L) * T_MAX));
}
function scrubTo(ev) {
  S.t = svgTime(ev);
  S.shown = S.events.find(e => Math.abs(e.t - S.t) < 0.04) || null;
  draw();
}
svg.addEventListener('pointerdown', ev => {
  if (!S.revealed || S.step === 'summary') return;
  if (S.ended) { dragging = true; S.dragHintSeen = true; svg.setPointerCapture(ev.pointerId); return scrubTo(ev); }
  if (S.playing) { S.playing = false; cancelAnimationFrame(raf); paused = true; }
  else if (paused) { paused = false; S.playing = true; last = performance.now(); raf = requestAnimationFrame(tick); }
  else if (S.holding) resume();
});
svg.addEventListener('pointermove', ev => { if (dragging) scrubTo(ev); });
svg.addEventListener('pointerup', () => { dragging = false; });
$('replay').onclick = () => startPlayback(S.endT, S.events);

// ---------- UI ----------
const ICON_OK = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 9.5l2.6 2.5L13 6.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const ICON_BAD = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 6l6 6M12 6l-6 6" stroke="currentColor" stroke-width="2"/></svg>';
function setPrimary(label, disabled) { const b = $('primary'); b.textContent = label; b.disabled = !!disabled; }
function setProgress(n) { [...$('progress').children].forEach((s, i) => s.classList.toggle('on', i < n)); }
function feedback(ok, msg) {
  const fb = $('feedback');
  fb.className = 'feedback ' + (ok ? 'ok' : 'bad'); fb.hidden = false;
  fb.innerHTML = (ok ? ICON_OK : ICON_BAD) + '<p><strong></strong><span></span></p>';
  fb.querySelector('strong').textContent = ok ? 'Correct.' : 'Not quite.';
  fb.querySelector('span').textContent = msg;
}
function optionButtons(list, layout) {
  const box = document.createElement('div');
  box.className = 'opts ' + layout; box.setAttribute('role', 'radiogroup');
  box.style.setProperty('--n', list.length);
  list.forEach(o => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.id = 'opt-' + S.step + '-' + o.id;
    b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false');
    b.textContent = o.text;
    b.onclick = () => {
      if (S.checked) return;
      S.choice = o;
      [...box.children].forEach(c => c.setAttribute('aria-checked', String(c === b)));
      setPrimary('Check', false);
    };
    box.appendChild(b);
  });
  return box;
}
function signRows() {
  const box = document.createElement('div'); box.className = 'signs';
  [['s', ' m'], ['u', ' m s⁻¹'], ['a', ' m s⁻²']].forEach(([k, unit]) => {
    const row = document.createElement('div');
    row.className = 'sign-row'; row.dataset.k = k; row.setAttribute('role', 'radiogroup'); row.setAttribute('aria-label', k);
    row.innerHTML = `<span>${k}</span>`;
    SIGNS[k].forEach(val => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.id = `sign-${k}-${val > 0 ? 'p' : 'n'}`; b.dataset.val = val;
      b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false');
      b.textContent = sgn(val) + Math.abs(val).toFixed(k === 's' ? 0 : k === 'u' ? 1 : 2) + unit;
      b.onclick = () => {
        if (S.checked) return;
        S.signs[k] = val;
        [...row.querySelectorAll('.opt')].forEach(c => c.setAttribute('aria-checked', String(c === b)));
        if (k === 's') { S.target = H0 + val; draw(); }
        setPrimary('Check', Object.keys(S.signs).length < 3);
      };
      row.appendChild(b);
    });
    box.appendChild(row);
  });
  return box;
}

function enterStep(step) {
  S.step = step; S.choice = null; S.checked = false; S.signs = {};
  cancelAnimationFrame(raf); clearTimeout(holdTimer);
  S.revealed = false; S.ghostU = null; S.target = null; S.shown = null; S.ended = false; S.t = 0; S.dragHintSeen = false; paused = false;
  $('replay').hidden = true; $('feedback').hidden = true;
  setProgress(STEPS.indexOf(step) + 1);
  const ans = $('answers'); ans.replaceChildren();
  const P = $('prompt');
  if (step === 'q1') {
    P.textContent = 'What is the sandbag’s velocity the instant it is released?';
    ans.appendChild(optionButtons(Q1, 'row'));
  } else if (step === 'why') {
    P.textContent = 'Why does the sandbag rise before it falls?';
    ans.appendChild(optionButtons(WHY, 'list'));
  } else if (step === 'eq') {
    P.textContent = 'You want the time to reach the ground. Which equation?';
    ans.appendChild(optionButtons(EQ, 'grid'));
  } else if (step === 'signs') {
    P.textContent = 'Put the values into s = ut + ½at². The app does the maths.';
    ans.appendChild(signRows());
  } else if (step === 'roots') {
    P.textContent = 'The app solved −30 = 4.0t − 4.905t². Which value is the answer?';
    ans.appendChild(optionButtons(ROOT_OPTS, 'row'));
  } else {
    P.textContent = 'Done. Here is how each answer went.';
    const rows = [['Velocity at release', 'q1'], ['Why it rises first', 'why'], ['Choosing the equation', 'eq'], ['Signs', 'signs'], ['Picking the root', 'roots']];
    const box = document.createElement('div'); box.className = 'summary';
    box.innerHTML = rows.map(([k, id]) => `<div class="row"><span>${k}</span><span class="chip ${S.outcomes[id]}">${S.outcomes[id] === 'independent' ? 'First try' : 'After feedback'}</span></div>`).join('');
    ans.appendChild(box);
    S.revealed = true; S.endT = T_REAL; S.t = T_REAL; S.events = [];
    setPrimary('Start again', false); draw(); return;
  }
  setPrimary('Check', true);
  draw();
}

function check() {
  S.checked = true;
  const st = S.step;
  if (st === 'signs') {
    const wrongKey = ['s', 'u', 'a'].find(k => S.signs[k] !== RIGHT[k]);
    const ok = !wrongKey;
    S.outcomes.signs = S.outcomes.signs || (ok ? 'independent' : 'assisted');
    $('answers').querySelectorAll('.sign-row').forEach(row => {
      const k = row.dataset.k;
      row.querySelectorAll('.opt').forEach(c => {
        c.disabled = true;
        if (c.getAttribute('aria-checked') === 'true') c.classList.add(S.signs[k] === RIGHT[k] ? 'right' : 'wrong');
        else c.classList.add('dim');
      });
    });
    if (ok) { feedback(true, 'Now the app solves it. Two values of t come out.'); return setPrimary('Next', false); }
    const roots = solveT(S.signs.s, S.signs.u, S.signs.a).filter(r => r > 0);
    const what = roots.length ? `These signs give ${f2(roots[0])} s. ` : 'These signs give no solution: it never gets there. ';
    feedback(false, what + SIGN_FB[wrongKey]);
    return setPrimary('Try again', false);
  }
  const list = { q1: Q1, why: WHY, eq: EQ, roots: ROOT_OPTS }[st];
  const ok = !!S.choice.correct;
  S.outcomes[st] = S.outcomes[st] || (ok ? 'independent' : 'assisted');
  $('answers').querySelectorAll('.opt').forEach((c, i) => {
    c.disabled = true;
    if (list[i].correct) c.classList.add('right');
    else if (c.getAttribute('aria-checked') === 'true') c.classList.add('wrong');
    else c.classList.add('dim');
  });
  feedback(ok, S.choice.fb);
  if (st === 'q1') {
    // stop before the landing so the next question's answer stays hidden
    S.primaryAfter = 'Next';
    S.ghostU = ok ? null : S.choice.u;
    const ev = [{ t: tApex(VB), kind: 'apex' }, { t: tBack(VB), kind: 'back', end: ok }];
    let endT = tBack(VB);
    if (!ok) { endT = tLand(S.ghostU); ev.push({ t: endT, kind: 'ghostLand', end: true }); }
    startPlayback(endT, ev);
  } else if (st === 'roots') {
    S.primaryAfter = 'See summary';
    startPlayback(T_REAL, [{ t: tApex(VB), kind: 'apex' }, { t: tBack(VB), kind: 'back' }, { t: T_REAL, kind: 'land', end: true }]);
  } else {
    setPrimary('Next', false);
  }
}

$('primary').onclick = () => {
  const label = $('primary').textContent;
  if (label === 'Check') return check();
  if (label === 'Try again') { const keep = S.outcomes.signs; enterStep('signs'); S.outcomes.signs = keep; return; }
  if (S.step === 'summary') { S.outcomes = {}; return enterStep('q1'); }
  enterStep(STEPS[STEPS.indexOf(S.step) + 1]);
};
enterStep('q1');
</script>
